name: Earendil
services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - 5173:5173
    depends_on: backend

  backend:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    ports: 
      - 8000:8000
    volumes:
      - ..:/app
    depends_on:
      - "db"
    env_file: 
      - ../.env
    environment:
      DATABASE_URL: postgresql://research_user:research_password@db:5432/Earendil
  
  db:
    image: postgres:latest
    env_file: 
      - ../.env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
    